<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 번역</title>
<script>
  // 저장된 테마가 있으면 화면이 그려지기 전에 먼저 적용 (깜빡임 방지)
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
</script>
<style>
  /* 배경색과 글자색을 짝지어 관리: 밝은 배경 = 검은 글자 */
  :root {
    --bg: #f2f4f6;
    --fg: #191f28;
    --card-bg: #ffffff;
    --card-fg: #191f28;
    --sub: #4e5968;
    --muted: #8b95a1;
    --border: #e5e8eb;
    --track: #f2f4f6;
    --seg-on: #ffffff;
    --accent: #3182f6;
    --accent-hover: #1b64da;
    --accent-fg: #ffffff;
    --tint: #e8f3ff;
    --success: #03b26c;
    --error: #f04452;
    --warn-bg: #fff3e0;
    --warn-fg: #8a4b00;
    --shadow: 0 2px 12px rgba(0, 27, 55, 0.06);
    color-scheme: light;
  }

  /* 어두운 배경 = 흰 글자 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171c;
      --fg: #ffffff;
      --card-bg: #202027;
      --card-fg: #ffffff;
      --sub: #c3c3c6;
      --muted: #8f8f96;
      --border: #2c2c35;
      --track: #2c2c35;
      --seg-on: #4d4d59;
      --tint: rgba(49, 130, 246, 0.16);
      --warn-bg: #3a2a12;
      --warn-fg: #ffd59e;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171c;
    --fg: #ffffff;
    --card-bg: #202027;
    --card-fg: #ffffff;
    --sub: #c3c3c6;
    --muted: #8f8f96;
    --border: #2c2c35;
    --track: #2c2c35;
    --seg-on: #4d4d59;
    --tint: rgba(49, 130, 246, 0.16);
    --warn-bg: #3a2a12;
    --warn-fg: #ffd59e;
    --shadow: none;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -0.02em;
    -webkit-font-smoothing: antialiased;
  }

  body { display: flex; flex-direction: column; }

  button { font: inherit; letter-spacing: inherit; cursor: pointer; border: none; }
  button:disabled { cursor: not-allowed; }

  /* ---- 헤더 ---- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-fg);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 800;
  }
  .theme-toggle {
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--card-fg);
    font-size: 14px;
    font-weight: 600;
    box-shadow: var(--shadow);
  }
  .theme-toggle:hover { background: var(--track); }

  .warning {
    margin: 16px 32px 0;
    padding: 16px 20px;
    border-radius: 16px;
    background: var(--warn-bg);
    color: var(--warn-fg);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }

  /* ---- 좌/우 2단 분할 ---- */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 20px;
    padding: 20px 32px 32px;
  }

  .card {
    background: var(--card-bg);
    color: var(--card-fg);
    border-radius: 24px;
    box-shadow: var(--shadow);
  }

  /* ---- 왼쪽 패널 ---- */
  .left {
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow-y: auto;
  }
  .left h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.35; }
  .left h1 + p { margin: 8px 0 0; color: var(--sub); font-size: 15px; line-height: 1.5; }
  .label { margin: 0 0 10px; font-size: 15px; font-weight: 700; color: var(--sub); }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 20px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--tint); }
  .dropzone svg { width: 40px; height: 40px; color: var(--accent); }
  .dropzone .title { margin-top: 10px; font-size: 16px; font-weight: 700; }
  .dropzone .hint { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .file-chip {
    display: none;
    margin-top: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--tint);
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    word-break: break-all;
  }
  .file-chip.show { display: inline-block; }

  /* 번역 방향: 세그먼트 컨트롤 */
  .segment {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 4px;
    border-radius: 14px;
    background: var(--track);
  }
  .segment input { position: absolute; opacity: 0; pointer-events: none; }
  .segment label {
    padding: 12px 8px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .segment input:checked + label {
    background: var(--seg-on);
    color: var(--card-fg);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }
  .segment input:focus-visible + label { outline: 2px solid var(--accent); }

  .primary {
    width: 100%;
    height: 56px;
    border-radius: 16px;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 17px;
    font-weight: 700;
    transition: background 0.15s, transform 0.1s;
  }
  .primary:hover:not(:disabled) { background: var(--accent-hover); }
  .primary:active:not(:disabled) { transform: scale(0.98); }
  .primary:disabled { background: var(--track); color: var(--muted); }

  .progress-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .percent { font-size: 34px; font-weight: 800; line-height: 1; }
  .count { font-size: 15px; color: var(--muted); font-weight: 600; }
  .progress { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .progress > div {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  /* 상태 메시지: 점 색상으로 상태 구분 */
  .status {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--track);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
  }
  .status::before {
    content: "";
    flex: none;
    width: 8px; height: 8px;
    margin-top: 8px;
    border-radius: 50%;
    background: var(--muted);
  }
  .status.busy::before { background: var(--accent); animation: pulse 1s infinite; }
  .status.done::before { background: var(--success); }
  .status.error { color: var(--error); }
  .status.error::before { background: var(--error); }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* ---- 오른쪽 패널: 원문 / 번역 카드 ---- */
  .right {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    min-height: 0;
  }
  .preview-card { display: flex; flex-direction: column; min-height: 0; }
  .preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 76px;
    padding: 20px 24px 12px;
  }
  .preview-head h2 { margin: 0; font-size: 19px; font-weight: 700; }
  .meta { margin-top: 4px; font-size: 14px; color: var(--muted); font-weight: 500; }
  .preview {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    margin: 0 8px 8px;
    padding: 8px 16px 20px;
    white-space: pre-wrap;
    word-break: keep-all;
    overflow-wrap: anywhere;
    font-size: 16px;
    line-height: 1.8;
    color: var(--card-fg);
  }
  .preview:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .preview::-webkit-scrollbar { width: 10px; }
  .preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 3px solid var(--card-bg); }

  .save {
    flex: none;
    padding: 10px 18px;
    border-radius: 12px;
    background: var(--tint);
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    transition: background 0.15s, color 0.15s;
  }
  .save:hover:not(:disabled) { background: var(--accent); color: var(--accent-fg); }
  .save:disabled { background: var(--track); color: var(--muted); }

  /* 중간 폭에서는 원문/번역 카드를 위아래로 */
  @media (max-width: 1280px) {
    .right { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }

  /* 900px 이하에서는 좌/우 패널을 위/아래로 쌓고 페이지 전체를 스크롤 */
  @media (max-width: 900px) {
    html, body { height: auto; }
    header { padding: 16px 16px 0; }
    .warning { margin: 12px 16px 0; }
    main { flex: none; grid-template-columns: 1fr; padding: 16px; gap: 16px; }
    .left { overflow: visible; }
    .right { grid-template-rows: 460px 460px; gap: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark">文</span>PDF 번역</div>
  <button type="button" class="theme-toggle" id="themeToggle"></button>
</header>

{% if api_key_missing %}
<div class="warning">
  환경 변수 <b>OPENAI_API_KEY</b>가 설정되지 않아 번역할 수 없어요.
  키를 설정한 뒤 서버를 다시 시작해 주세요.
</div>
{% endif %}

<main>
  <!-- 왼쪽: 컨트롤 및 진행 상태 -->
  <section class="card left">
    <div>
      <h1>PDF를 올리면<br>바로 번역해 드릴게요</h1>
      <p>텍스트가 있는 PDF라면 페이지 순서와 문단을 유지해서 번역해요.</p>
    </div>

    <div>
      <div class="dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
          <path d="M14 3v5h5"/><path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>
        </svg>
        <div class="title">PDF 파일 선택</div>
        <div class="hint">또는 여기로 끌어다 놓으세요</div>
        <div class="file-chip" id="fileName"></div>
      </div>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
    </div>

    <div>
      <p class="label">번역 방향</p>
      <div class="segment">
        <input type="radio" name="direction" value="en2ko" id="dirEn2ko" checked>
        <label for="dirEn2ko">영어 → 한국어</label>
        <input type="radio" name="direction" value="ko2en" id="dirKo2en">
        <label for="dirKo2en">한국어 → 영어</label>
      </div>
    </div>

    <button type="button" class="primary" id="startBtn" disabled>번역 시작</button>

    <div>
      <p class="label">진행률</p>
      <div class="progress-head">
        <span class="percent" id="percentText">0%</span>
        <span class="count" id="countText">(0/0)</span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <div class="status" id="status">PDF 파일을 선택해 주세요.</div>
  </section>

  <!-- 오른쪽: 미리보기 및 저장 -->
  <section class="right">
    <div class="card preview-card">
      <div class="preview-head">
        <div>
          <h2>PDF에서 추출한 원문</h2>
          <div class="meta" id="sourceMeta">아직 업로드한 파일이 없어요</div>
        </div>
      </div>
      <div class="preview" id="sourcePreview" data-placeholder="PDF를 올리면 추출한 원문이 여기에 보여요."></div>
    </div>

    <div class="card preview-card">
      <div class="preview-head">
        <div>
          <h2>번역 결과</h2>
          <div class="meta" id="resultMeta">번역을 시작하면 순서대로 채워져요</div>
        </div>
        <button type="button" class="save" id="saveBtn" disabled>저장</button>
      </div>
      <div class="preview" id="resultPreview" data-placeholder="번역된 내용이 도착하는 대로 여기에 추가돼요."></div>
    </div>
  </section>
</main>

<script>
  const apiKeyMissing = {{ "true" if api_key_missing else "false" }};

  const $ = (id) => document.getElementById(id);
  const dropzone = $("dropzone");
  const fileInput = $("fileInput");
  const startBtn = $("startBtn");
  const saveBtn = $("saveBtn");
  const sourcePreview = $("sourcePreview");
  const resultPreview = $("resultPreview");

  let jobId = null;
  let translating = false;

  // ---- 테마 전환 ----
  const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
  const currentTheme = () =>
    document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");

  function renderThemeButton() {
    $("themeToggle").textContent = currentTheme() === "dark" ? "☀ 라이트 모드" : "☾ 다크 모드";
  }
  $("themeToggle").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
    renderThemeButton();
  });
  darkQuery.addEventListener("change", renderThemeButton);
  renderThemeButton();

  // ---- 상태 표시 (kind: idle / busy / done / error) ----
  function setStatus(message, kind = "idle") {
    const el = $("status");
    el.textContent = message;
    el.className = `status ${kind}`;
  }

  function setProgress(percent, current, total) {
    $("progressBar").style.width = `${percent}%`;
    $("percentText").textContent = `${percent}%`;
    $("countText").textContent = `(${current}/${total})`;
  }

  // 업로드 완료 + 번역 중 아님 + API 키 있음일 때만 시작 가능
  function updateStartButton() {
    startBtn.disabled = !jobId || translating || apiKeyMissing;
  }

  // ---- 업로드 (클릭 선택 + 드래그 앤 드롭) ----
  dropzone.addEventListener("click", () => { if (!translating) fileInput.click(); });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach((type) =>
    dropzone.addEventListener(type, (e) => { e.preventDefault(); dropzone.classList.add("over"); })
  );
  ["dragleave", "drop"].forEach((type) =>
    dropzone.addEventListener(type, (e) => { e.preventDefault(); dropzone.classList.remove("over"); })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file && !translating) uploadFile(file);
  });

  async function uploadFile(file) {
    // 새 파일을 올리면 이전 작업 상태를 초기화
    jobId = null;
    saveBtn.disabled = true;
    updateStartButton();
    sourcePreview.textContent = "";
    resultPreview.textContent = "";
    $("sourceMeta").textContent = "아직 업로드한 파일이 없어요";
    $("resultMeta").textContent = "번역을 시작하면 순서대로 채워져요";
    setProgress(0, 0, 0);
    $("fileName").textContent = file.name;
    $("fileName").classList.add("show");

    if (!file.name.toLowerCase().endsWith(".pdf")) {
      setStatus("PDF 파일만 올릴 수 있어요.", "error");
      return;
    }

    setStatus("업로드하고 텍스트를 추출하는 중이에요...", "busy");
    const form = new FormData();
    form.append("file", file);

    try {
      const res = await fetch("/upload", { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "업로드에 실패했어요.");

      jobId = data.job_id;
      sourcePreview.textContent = data.text;
      $("sourceMeta").textContent =
        `${data.page_count}페이지 · ${data.text.length.toLocaleString()}자`;
      setStatus(apiKeyMissing
        ? "추출 완료! 하지만 API 키가 없어서 번역할 수 없어요."
        : `추출 완료! ${data.page_count}페이지를 읽었어요.`, apiKeyMissing ? "error" : "done");
    } catch (err) {
      setStatus(err.message, "error");
    }
    updateStartButton();
  }

  // ---- 번역 (SSE) ----
  startBtn.addEventListener("click", () => {
    if (!jobId || translating) return;

    const direction = document.querySelector('input[name="direction"]:checked').value;
    translating = true;
    updateStartButton();
    saveBtn.disabled = true;
    resultPreview.textContent = "";
    setProgress(0, 0, 0);
    setStatus("번역을 시작했어요...", "busy");

    const source = new EventSource(`/translate/${jobId}?direction=${direction}`);
    let finished = false;

    const finish = () => {
      finished = true;
      source.close();  // 닫지 않으면 EventSource가 자동 재연결한다
      translating = false;
      updateStartButton();
    };

    source.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === "progress") {
        setProgress(msg.percent, msg.current, msg.total);
        setStatus(`번역하는 중이에요 (${msg.current}/${msg.total})`, "busy");
        $("resultMeta").textContent = `${msg.current}/${msg.total} 조각 번역됨`;
        // 청크마다 결과를 이어 붙이고 맨 아래로 스크롤
        if (resultPreview.textContent) resultPreview.textContent += "\n\n";
        resultPreview.textContent += msg.text;
        resultPreview.scrollTop = resultPreview.scrollHeight;
      } else if (msg.type === "done") {
        finish();
        saveBtn.disabled = false;
        $("resultMeta").textContent = `${resultPreview.textContent.length.toLocaleString()}자 · ${msg.filename}`;
        setStatus(`번역 완료! ${msg.filename} 파일로 저장했어요.`, "done");
      } else if (msg.type === "error") {
        finish();
        setStatus(msg.message, "error");
      }
    };

    source.onerror = () => {
      if (finished) return;
      finish();
      setStatus("서버와의 연결이 끊어졌어요.", "error");
    };
  });

  // ---- 저장 ----
  saveBtn.addEventListener("click", () => {
    if (jobId) window.location.href = `/download/${jobId}`;
  });
</script>
</body>
</html>
