{% extends 'base.html' %}
{% block title %}회원가입{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="bg-white rounded-3 shadow-sm p-4">
      <h4 class="fw-bold mb-4 text-center">회원가입</h4>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="username" class="form-label">사용자 이름</label>
          <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}"
                 minlength="2" maxlength="50" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input type="password" class="form-control" id="password" name="password" minlength="4" required>
          <div class="form-text">4자 이상</div>
        </div>
        <div class="mb-3">
          <label for="password2" class="form-label">비밀번호 확인</label>
          <input type="password" class="form-control" id="password2" name="password2" minlength="4" required>
        </div>
        <button type="submit" class="btn btn-success w-100">가입하기</button>
      </form>
      <p class="text-center small mt-3 mb-0">
        이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
