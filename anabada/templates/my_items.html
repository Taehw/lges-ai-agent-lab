{% extends 'base.html' %}
{% block title %}내 물품{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">내가 등록한 물품 <small class="text-muted">({{ items|length }})</small></h5>
  <a href="{{ url_for('item_create') }}" class="btn btn-success btn-sm"><i class="bi bi-plus-lg"></i> 물품 등록</a>
</div>

{% if items %}
  <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">
    {% for item in items %}
      {% include '_item_card.html' %}
    {% endfor %}
  </div>
{% else %}
  <div class="text-center text-muted py-5">
    <i class="bi bi-box-seam display-4"></i>
    <p class="mt-3">아직 등록한 물품이 없습니다.</p>
  </div>
{% endif %}
{% endblock %}
